[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rice_disease_rna_cv"
version = "0.1.0"
description = "Détection des maladies de riz par vision artificielle"
readme = "README.md"
authors = [{ name = "RNA CV Team" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.3.0",
    "Pillow>=10.0.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
